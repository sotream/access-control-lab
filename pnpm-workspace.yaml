packages:
  - apps/*
  - packages/*
  - tests/*
# supply chain: refuse versions younger than 24 hours (minutes). Unverified for pnpm 12.9.1: checked by install below.
minimumReleaseAge: 1440
overrides:
  katex: 0.18.2
  # GHSA-q7qp-rjg7-q26m: @nestjs/platform-express pins multer 2.4.0 exactly, fix is 2.5.0. Remove once platform-express pins >= 2.5.0.
  multer: 2.5.0
  # GHSA-g3hv-75wg-m249: eslint and @eslint/config-array pin minimatch 10.x, fix is 11.0.1. Remove once they allow >= 11.0.1.
  minimatch: ^11.0.1
