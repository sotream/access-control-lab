# DEV ONLY stack. All ports bind to 127.0.0.1. Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 # 18.x: the image keeps data under /var/lib/postgresql/18/docker, so the volume is mounted one level up; an old 17 volume is not reusable (docker compose down -v for dev data)
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?set in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      CASEFILE_MIGRATOR_PASSWORD: ${CASEFILE_MIGRATOR_PASSWORD:?set in .env}
      CASEFILE_APP_PASSWORD: ${CASEFILE_APP_PASSWORD:?set in .env}
      CASEFILE_WEB_DB_PASSWORD: ${CASEFILE_WEB_DB_PASSWORD:?set in .env}
      CASEFILE_AUDIT_PASSWORD: ${CASEFILE_AUDIT_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
      - ./infra/postgres/init-app-roles.sh:/docker-entrypoint-initdb.d/20-app-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b # latest GitHub release 2026-10-17; 26.4.0 predates many CVE fixes
    restart: unless-stopped
    # start-dev: dev mode only (HTTP, relaxed hostname). Stage 2+ must not assume this is production-like.
    command: ["start-dev", "--import-realm", "--features-disabled=device-flow,ciba,impersonation"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      # fixed public URL: pins the token issuer and rejects other Host headers
      KC_HOSTNAME: http://127.0.0.1:8080
      # substituted into infra/keycloak/realm-casefile.json at import (dev only values, see .env.example)
      CASEFILE_WEB_SECRET: ${CASEFILE_WEB_SECRET:?set in .env}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:?set in .env}
      DEV_TOTP_SECRET: ${DEV_TOTP_SECRET:?set in .env}
    volumes:
      - ./infra/keycloak/realm-casefile.json:/opt/keycloak/data/import/realm-casefile.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000" # management (health, metrics)
    healthcheck:
      # image has no curl; raw HTTP over bash /dev/tcp against the management port
      # the status LINE of /health/ready decides (200 only when ready): the body of a DOWN answer still contains sub-checks that say "UP"
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres-data:
