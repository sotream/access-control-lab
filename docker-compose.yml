# DEV ONLY stack. All ports bind to 127.0.0.1. Credentials come from .env (see .env.example).
services:
  postgres:
    image: postgres:17.11-alpine # newest 17.x tag on Docker Hub, checked 2026-10-17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?set in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1 # latest GitHub release 2026-10-17; 26.4.0 predates many CVE fixes
    restart: unless-stopped
    # start-dev: dev mode only (HTTP, relaxed hostname). Stage 2+ must not assume this is production-like.
    command: ["start-dev", "--import-realm", "--features-disabled=device-flow,ciba,impersonation"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      # fixed public URL: pins the token issuer and rejects other Host headers
      KC_HOSTNAME: http://127.0.0.1:8080
      # substituted into infra/keycloak/realm-casefile.json at import (dev only values, see .env.example)
      CASEFILE_WEB_SECRET: ${CASEFILE_WEB_SECRET:?set in .env}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:?set in .env}
      DEV_TOTP_SECRET: ${DEV_TOTP_SECRET:?set in .env}
    volumes:
      - ./infra/keycloak/realm-casefile.json:/opt/keycloak/data/import/realm-casefile.json:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000" # management (health, metrics)
    healthcheck:
      # image has no curl; raw HTTP over bash /dev/tcp against the management port
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres-data:
