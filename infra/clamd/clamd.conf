# clamd for the prod-like stack: listens on the internal scan network only (the compose network is the boundary), logs to stderr (foreground, no log file).
Foreground yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
MaxFileSize 26M
StreamMaxLength 26M
MaxScanSize 100M
MaxRecursion 10
MaxFiles 10000
