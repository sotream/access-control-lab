name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
      - name: SBOM (CycloneDX, production dependencies)
        run: pnpm sbom --sbom-format cyclonedx --prod > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  identity:
    # Real Keycloak from docker compose, realm imported from infra/keycloak. Docker is preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start stack (dev-only credentials from .env.example)
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 300
      - name: Migrate the dev database as casefile_migrator
        run: pnpm db:migrate
      - run: pnpm test:identity
      - name: Data layer tests (RLS, parity with the policy package, TOCTOU, pool hygiene, SQL injection)
        run: pnpm test:db
      - name: BFF end-to-end tests (production Next.js server, API, Postgres, Keycloak)
        run: pnpm test:bff
      - name: Keycloak logs on failure
        if: failure()
        run: docker compose logs --no-color keycloak | tail -200
      - name: Stop stack
        if: always()
        run: docker compose down -v

  prod-like:
    # The prod-like stack (TLS proxy, internal networks, non-root read-only containers, ClamAV) and the attacks on it: scripts/prod-like-test.mjs
    # (docs/deployment.md). Builds seven images, so it is the slowest job.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Prod-like stack tests
        run: node scripts/prod-like-test.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml logs --no-color --tail 80
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml down -v


  attack-tests:
    # The black-box attack suite (docs/attack-catalogue.md): the catalogued scripted attacks and a fuzzer against the prod-like stack through its proxy, as an attacker with
    # network access and the seed users' accounts. The OWASP ZAP baseline runs first, on the fresh stack (the hostile text the other attacks store would otherwise be
    # reported as a finding), then everything else on the same stack. Fixed fuzz seed (printed); the nightly workflow uses a random one.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the stack's throw-away secrets and certificates
        run: node scripts/prod-like-setup.mjs
      - name: ZAP baseline on the fresh stack (starts it and leaves it running)
        run: ATTACK_KEEP=1 ATTACK_ZAP=1 NODE_EXTRA_CA_CERTS="$PWD/secrets-dev/prod-like/ca.crt" pnpm --filter @acl/attack-tests exec vitest run src/zap.test.ts
      - name: The attacks
        run: ATTACK_NO_UP=1 NODE_EXTRA_CA_CERTS="$PWD/secrets-dev/prod-like/ca.crt" pnpm --filter @acl/attack-tests exec vitest run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-report
          path: tests/attack/.cache/zap
          retention-days: 30
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml logs --no-color --tail 60
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml down -v

  e2e-browser:
    # A real Chromium (Playwright, exact version in tests/e2e/package.json) against the prod-like stack: a real Keycloak sign-in per seed user, every page of every
    # role with a CSP violation collector and axe, cookies, framing, storage, keyboard order, the main flows (docs/ui.md). Budget: about four minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the stack's throw-away secrets and certificates
        run: node scripts/prod-like-setup.mjs
      - name: Start the prod-like stack
        run: |
          docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml up -d --build --wait --wait-timeout 900
          docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml restart caddy
      - name: Install the browser
        run: pnpm --filter @acl/e2e-tests exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm --filter @acl/e2e-tests exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-results
          path: tests/e2e/test-results
          retention-days: 14
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml logs --no-color --tail 60
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml down -v

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cache-cleanup:
    # Runs only when every job above passed. Deletes the caches of this pull request's own ref: they are readable only by this
    # pull request, so nothing else needs them, and they count against the 10 GB repository limit. Caches of main stay (they are
    # the restore base for every pull request). Skipped for Dependabot: its token is read-only, and its caches expire on their own.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [check, identity, prod-like, attack-tests, e2e-browser, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete this pull request's caches
        run: |
          gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id' | while read -r id; do
            gh cache delete "$id"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge

  cache-cleanup-main:
    # Runs on main (and manual runs) only when every job above passed. Deletes (1) the caches of pull requests that are no longer open,
    # which includes Dependabot's (the per-pull-request job above skips those: its token is read-only) and PRs merged before that job
    # existed, and (2) every cache of main that is not the newest of its kind. A "kind" is the key without its trailing hash or date, so
    # node-cache-<hash> and cache-trivy-<date> each keep their newest one, which stays the restore base for pull requests.
    if: github.event_name != 'pull_request'
    needs: [check, identity, prod-like, attack-tests, e2e-browser, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Delete stale caches
        run: |
          open=$(gh pr list --state open --limit 100 --json number --jq '[.[].number]')
          gh cache list --limit 100 --json id,key,ref,createdAt | jq -r --argjson open "$open" '
            def kind: .key | sub("-([0-9a-f]{16,}|[0-9]{4}-[0-9]{2}-[0-9]{2})$"; "");
            ( [ .[] | select(.ref | test("^refs/pull/[0-9]+/merge$"))
                    | select((.ref | capture("^refs/pull/(?<n>[0-9]+)/merge$").n | tonumber) as $n | ($open | index($n)) | not) | .id ]
            + ( [ .[] | select(.ref == "refs/heads/main") ] | group_by(kind) | map(sort_by(.createdAt) | reverse | .[1:][]) | map(.id) ) )
            | .[]' | while read -r id; do
              gh cache delete "$id"
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
