name: attack-mutation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-mutation:
    # Mutation spot-check of the attack suite (scripts/attack-mutation.mjs): break 17 defences one at a time, rebuild, run the attacks that should notice.
    # Manual: every mutant rebuilds images (about two hours in total).
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack and run the suite once (sessions and fixtures are created on the way)
        run: |
          node scripts/prod-like-setup.mjs
          ATTACK_KEEP=1 NODE_EXTRA_CA_CERTS="$PWD/secrets-dev/prod-like/ca.crt" pnpm --filter @acl/attack-tests exec vitest run src/authz.test.ts
      - name: Mutants
        run: node scripts/attack-mutation.mjs
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod-like.yml -f docker-compose.prod-like.test.yml down -v
